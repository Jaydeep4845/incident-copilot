[project]
name = "incident-copilot"
version = "0.1.0"
description = "AI on-call agent that investigates production alerts and reports an evidence-linked root cause."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaydeep Chavda" }]
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "fastapi>=0.115",
    "celery[redis]>=5.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# prompts and tool descriptions are prose for the LLM
"agent/investigate.py" = ["E501"]
"agent/tools.py" = ["E501"]
"agent/baselines.py" = ["E501"]
"agent/benchmark.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
