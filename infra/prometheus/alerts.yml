# The same kind of symptom-based alerts an on-call team would page on.
groups:
  - name: service-health
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (job) (rate(http_requests_total{status=~"5.."}[1m]))
            / sum by (job) (rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }}: more than 5% of requests are failing"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[1m]))) > 1
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }}: p95 latency above 1 second"

      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }}: metrics endpoint unreachable"
