global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [alerts.yml]

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8000"] }]
  - job_name: orders
    static_configs: [{ targets: ["orders:8000"] }]
  - job_name: inventory
    static_configs: [{ targets: ["inventory:8000"] }]
  - job_name: payments
    static_configs: [{ targets: ["payments:8000"] }]
